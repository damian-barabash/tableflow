name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  indexnow:
    # tells Bing / Yandex / Seznam / Naver about every URL of the fresh deploy (IndexNow; Google ignores it)
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Ping IndexNow
        run: |
          KEY=cc543022bb283e16861f9f53641613e2
          URLS=$(curl -fsSL https://tableflow.studio/sitemap.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//' | python3 -c "import json,sys;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))")
          curl -sS -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"tableflow.studio\",\"key\":\"$KEY\",\"keyLocation\":\"https://tableflow.studio/$KEY.txt\",\"urlList\":$URLS}" -w '\nIndexNow HTTP %{http_code}\n' || true
